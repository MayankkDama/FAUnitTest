name: Firebase Test Lab

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=256m -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Add whatever secret/setup steps THAT project needs (gradle props, keystore, etc.)

      - name: Set up Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TEMP }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --max-workers=1

      - name: Run tests on Firebase Test Lab
        run: |
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

          if [ ! -f "$APP_APK" ]; then
            echo "App APK not found at: $APP_APK"
            exit 1
          fi
          if [ ! -f "$TEST_APK" ]; then
            echo "androidTest APK not found at: $TEST_APK"
            exit 1
          fi

          echo "Listing virtual devices:"
          gcloud firebase test android models list --filter="virtual"

          gcloud firebase test android run \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait